services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
      MYSQL_USER: bmp
      MYSQL_PASSWORD: ${DB_PASSWORD:-bmp-secret}
      MYSQL_DATABASE: bmp_goods
    volumes:
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./sql/002_trade.sql:/docker-entrypoint-initdb.d/002_trade.sql:ro
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20

  bmp:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: bmp
      DB_PASSWORD: ${DB_PASSWORD:-bmp-secret}
      DB_NAME: bmp_goods
      PORT: "3000"
    ports:
      - "3000:3000"

volumes:
  mysql-data:
